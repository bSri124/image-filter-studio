<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait Mode AI V2</title><link rel="stylesheet" href="portrait.css"></head><body><main class="card"><h1>Portrait Mode <small>AI V2</small></h1><p>Person segmentation + background blur.</p><label class="pick"><input id="file" type="file" accept="image/*"><b>Choose a photo</b><span>Tap to open Gallery / Files</span></label><div class="preview"><canvas id="canvas"></canvas><div id="status">Choose a photo to begin.</div></div><label>Portrait<select id="style"><option value="natural">Natural</option><option value="studio">Studio</option><option value="warm">Warm Portrait</option><option value="dramatic">Dramatic Portrait</option><option value="bw">B&amp;W Portrait</option></select></label><label>Depth <output id="dv">70%</output><input id="depth" type="range" min="0" max="100" value="70"></label><label>Edge protection <output id="ev">High</output><input id="edge" type="range" min="0" max="100" value="85"><span class="hint">Higher values protect hair, glasses and nearby details.</span></label><label class="check"><input id="mask" type="checkbox"> Show subject mask</label><div class="buttons"><button id="load" disabled>Load Portrait AI</button><button id="apply" disabled>Apply Portrait</button><button id="download" disabled>Download</button></div></main><script type="module" src="portrait-upload.js"></script></body></html>
