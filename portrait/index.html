<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait Mode</title><link rel="stylesheet" href="portrait.css"></head><body><main class="card"><header><h1>Portrait Mode <span>AI Module</span></h1><p>Person segmentation and depth-style background blur.</p></header><label class="file-box"><input id="portraitFile" type="file" accept="image/*"><div class="file-text"><strong>Choose a photo</strong><small>Tap to open Gallery / Files</small></div></label><div class="preview-wrap"><canvas id="portraitCanvas"></canvas><div id="portraitStatus" class="status">Choose a photo to begin.</div></div><section class="control"><div><b>Depth</b><span id="depthValue">45%</span></div><input id="depth" type="range" min="0" max="100" value="45"></section><section class="control"><div><b>Edge Protection</b><span id="edgeValue">High</span></div><input id="edge" type="range" min="0" max="100" value="85"></section><button id="loadPortraitAI" disabled>Load Portrait AI</button><button id="applyPortrait" disabled>Apply Portrait</button><button id="downloadPortrait" disabled>Download</button><p class="note">AI loads only when you press “Load Portrait AI”. Processing is done in the browser.</p></main><script type="module" src="portrait-upload.js"></script></body></html>
