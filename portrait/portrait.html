<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Portrait Mode</title>
  <link rel="stylesheet" href="portrait.css">
</head>
<body>
  <main class="portrait-app">
    <h1>Portrait Mode <small>Extra Module</small></h1>
    <p class="sub">Upload and preview are completely independent from the Portrait AI.</p>

    <section class="panel">
      <div class="file-box">
        <input id="portraitFile" type="file" accept="image/*">
        <div class="file-text">
          <b>Choose a photo</b>
          <span>Tap to open Gallery / Files</span>
        </div>
      </div>

      <div class="preview">
        <canvas id="portraitCanvas"></canvas>
        <div id="portraitStatus">Choose a photo to begin.</div>
      </div>

      <div class="controls">
        <label>Depth <output id="depthOut">45%</output>
          <input id="depth" type="range" min="0" max="100" value="45">
        </label>

        <label>Edge Protection <output id="edgeOut">High</output>
          <input id="edge" type="range" min="0" max="100" value="82">
        </label>
      </div>

      <button id="loadPortraitAI" disabled>Load Portrait AI</button>
      <button id="applyPortrait" disabled>Apply Portrait</button>
      <button id="downloadPortrait" disabled>Download</button>
    </section>
  </main>

  <script src="portrait-upload.js"></script>
</body>
</html>
